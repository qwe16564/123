# Spring Boot application properties
spring.application.name=jobmanagementsystem

# H2 Database Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Properties
spring.jpa.hibernate.ddl-auto=update # For development, 'update' is convenient. For prod, use Flyway exclusively.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true # Format SQL for better readability

# Datasource Properties for H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway properties (Flyway is auto-configured if present on classpath)
# spring.flyway.enabled=true # Default is true if Flyway core is on classpath
# spring.flyway.locations=classpath:db/migration # Default location

# Jackson properties (optional, for date formatting etc.)
# spring.jackson.serialization.write-dates-as-timestamps=false
# spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# spring.jackson.time-zone=UTC

# File Upload Configuration
file.upload-dir=./uploads # Relative to project root, ensure this directory is writable
# For a more robust setup, use an absolute path or externalized configuration.
